name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/build-windows.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: dotnet publish src/Asistanim.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Asistanim-windows
          path: publish/Asistanim.exe
      - name: Publish release (latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest publish/Asistanim.exe --title "Asistanım (son sürüm)" --notes "Asistanim.exe dosyasını indirip çift tıkla." --target ${{ github.sha }}
